server:
  port: 8082

spring:
  application:
    name: ms-rutaexpress-catalog
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

security:
  oauth2:
    jwt:
      issuer-uri: https://login.microsoftonline.com/common/v2.0